<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нажми</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: radial-gradient(circle at center, #1a0505 0%, #0a0a0a 70%);
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    font-size: clamp(28px, 7vw, 96px);
    font-weight: 800;
    letter-spacing: 2px;
    text-align: center;
    color: #ff3b6b;
    text-shadow:
      0 0 20px rgba(255, 59, 107, 0.8),
      0 0 60px rgba(255, 59, 107, 0.5);
    user-select: none;
    pointer-events: none;
    white-space: nowrap;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.45s ease;
    z-index: 1;
  }

  #message.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    animation: pulse 1.8s ease-in-out infinite 0.5s;
  }

  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 20px rgba(255,59,107,0.8), 0 0 60px rgba(255,59,107,0.5); }
    50%      { text-shadow: 0 0 35px rgba(255,59,107,1),   0 0 90px rgba(255,59,107,0.8); }
  }

  #btn {
    position: relative;
    z-index: 2;
    padding: 28px 72px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: #e01e1e;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow:
      0 8px 0 #8a0f0f,
      0 14px 30px rgba(224, 30, 30, 0.5);
    transition: transform 0.08s ease, box-shadow 0.08s ease,
                background 0.2s ease;
  }

  #btn:hover {
    background: #ff2b2b;
    box-shadow:
      0 8px 0 #8a0f0f,
      0 14px 40px rgba(255, 43, 43, 0.7);
  }

  #btn:active {
    transform: translateY(6px);
    box-shadow:
      0 2px 0 #8a0f0f,
      0 6px 18px rgba(224, 30, 30, 0.5);
  }
</style>
</head>
<body>
  <div class="stage">
    <div id="message">Я ТЕБЯ ЛЮБЛЮ МАЛЫШ❤️</div>
    <button id="btn">Нажми</button>
  </div>

<script>
  const btn = document.getElementById('btn');
  const message = document.getElementById('message');
  let shown = false;

  btn.addEventListener('click', () => {
    if (shown) return;
    shown = true;

    message.classList.add('show');

    // кнопка уезжает вниз и гаснет, чтобы не закрывать надпись
    btn.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
    btn.style.transform = 'translateY(240px)';
    btn.style.opacity = '0.15';
    btn.style.pointerEvents = 'none';
  });
</script>
</body>
</html>
